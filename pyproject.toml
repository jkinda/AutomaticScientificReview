[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scireview"
version = "0.1.0"
description = "An automated scientific literature review agent built on Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8,<3",
    "requests>=2.32,<3",
    "pypdf>=5,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scireview = "scireview.cli:main"

[tool.setuptools]
packages = ["scireview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
